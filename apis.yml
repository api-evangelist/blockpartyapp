aid: blockpartyapp
name: Blockpartyapp
description: 'Block Party is a consumer privacy tool — a browser extension (Chrome,
  Firefox, and Edge) that helps people deep-clean and secure their social media presence.
  It scans connected accounts for privacy and security exposures, then automates bulk
  cleanup across Facebook, X/Twitter, Instagram, Reddit, and LinkedIn: deleting old
  posts, likes, and comments, untagging photos, removing connections, stripping location
  data, and tightening privacy settings. Founded by Tracy Chou, Block Party (also
  branded Privacy Party) is a consumer-facing application and does not publish a public
  developer API.'
